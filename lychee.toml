# Налаштування перевірки посилань (lychee) для .github/workflows/docs.yml

# локальні адреси з інструкцій запуску
exclude = [
  "^https?://localhost",
  "^http://<сервер>",
  # сторінки, що вимагають входу в акаунт і повертають 401/403 роботам
  "^https://aistudio\\.google\\.com",
  "^https://console\\.anthropic\\.com",
]

exclude_path = ["node_modules", ".venv", "frontend/dist"]

# 429 — сайт обмежив частоту запитів робота; це не бите посилання
accept = ["200..=299", "429"]

max_retries = 3
timeout = 20
